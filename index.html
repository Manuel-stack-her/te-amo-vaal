<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Para Valeria ❤️</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Georgia,serif;color:white;background:#090107}
#intro,#scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
#intro{z-index:5;background:radial-gradient(circle,#65132e,#090107);transition:opacity 1.4s}
#intro.hide{opacity:0;pointer-events:none}.intro{padding:25px}.env{font-size:85px;animation:p 1.2s infinite}.hint{margin-top:20px;letter-spacing:3px;opacity:.7}
#scene{background:radial-gradient(circle at center,#701633,#280712 45%,#050005)}
.card{width:min(90%,520px);padding:40px 24px;border-radius:30px;background:#10030b99;border:1px solid #ffffff2b;box-shadow:0 0 80px #ff30601f;backdrop-filter:blur(8px)}
.mini{font-size:13px;letter-spacing:4px;color:#efb7c6}.heart{font-size:76px;animation:p 1.3s infinite}h1{font-size:clamp(40px,12vw,68px);font-weight:400;margin:8px 0 15px;text-shadow:0 0 25px #ff7195}.line{width:80px;height:1px;background:#e8a5b8;margin:22px auto}.msg{font-size:19px;line-height:1.7;color:#f9e5ec}.sig{margin-top:22px;color:#ddb3c1}button{margin-top:26px;padding:12px 23px;border-radius:30px;border:1px solid #ffffff55;background:#ffffff10;color:white;font-size:15px}
.float{position:fixed;bottom:-50px;z-index:2;animation:up linear forwards}@keyframes up{0%{opacity:0;transform:translateY(0)}10%{opacity:.9}100%{opacity:0;transform:translateY(-115vh) rotate(35deg)}}@keyframes p{50%{transform:scale(1.16)}}
</style></head><body>
<div id="intro" onclick="openLetter()"><div class="intro"><div class="env">💌</div><div style="font-size:25px">Valeria, tengo algo que decirte...</div><div class="hint">TOCA LA PANTALLA</div></div></div>
<div id="scene"><div class="card"><div class="mini">PARA TI, VALERIA</div><div class="heart">❤️</div><h1>Te amo, Valeria</h1><div class="line"></div><div class="msg" id="msg">No necesitaba una fecha especial para decírtelo.<br><br>Solo quería recordarte que eres alguien muy especial para mí, y que cada momento contigo tiene un lugar en mi corazón.</div><div class="sig">Con todo mi amor ❤️</div><button onclick="last(event)">Una última cosa...</button></div></div>
<script>
function openLetter(){document.getElementById('intro').classList.add('hide');setInterval(heart,450)}
function heart(){let h=document.createElement('div');h.className='float';h.textContent=['❤️','💕','💗','💖','✨'][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+'vw';h.style.fontSize=15+Math.random()*28+'px';h.style.animationDuration=5+Math.random()*7+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),13000)}
function last(e){e.stopPropagation();document.getElementById('msg').innerHTML='Si alguna vez dudas de lo que siento por ti:<br><br><strong style="font-size:32px">TE AMO, VALERIA ❤️</strong>'}
</script></body></html>
